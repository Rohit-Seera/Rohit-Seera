# Generates the contribution snake animation and publishes it to the `output` branch.
#
# This file must live at:  .github/workflows/snake.yml
# in the repository named exactly "Rohit-Seera".

name: Generate Snake Animation

on:
  schedule:
    # Runs daily at 00:00 UTC (05:30 IST)
    - cron: "0 0 * * *"
  # Lets you trigger it manually from the Actions tab
  workflow_dispatch:
  # Also regenerate whenever you push to main
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: Rohit-Seera
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# Generates the contribution snake animation and refreshes profile stats.
name: Generate Profile Stats & Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repo
        uses: actions/checkout@v4

      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: Rohit-Seera
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Fetch contribution data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api graphql \
            -f login=Rohit-Seera \
            -f query='query($login:String!){user(login:$login){contributionsCollection{totalCommitContributions contributionCalendar{totalContributions}}}}' \
            --jq '.' > contributions.json
          gh api /users/Rohit-Seera --jq '.public_repos' > public_repos.txt
          test -s contributions.json
          test -s public_repos.txt

      - name: Generate local stats and snake cards
        run: |
          export PUBLIC_REPOS="$(cat public_repos.txt)"
          python .github/scripts/generate_contribution_assets.py

      - name: Commit refreshed profile cards to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg profile/contribution-count.svg profile/contribution-eaten.svg
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh GitHub profile cards [skip ci]"
          git push

      - name: Publish snake assets to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

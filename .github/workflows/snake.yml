# Generates the contribution snake animation and refreshes profile stats.
name: Generate Profile Stats & Snake

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repo
        uses: actions/checkout@v4

      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: Rohit-Seera
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Make generated snake files writable
        run: sudo chmod -R a+rwX dist

      - name: Fetch contribution data from the same calendar GitHub displays
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api graphql \
            -f login=Rohit-Seera \
            -f query='query($login:String!){user(login:$login){contributionsCollection{totalCommitContributions contributionCalendar{totalContributions weeks{contributionDays{date contributionCount}}}}}}' \
            --jq '.' > contributions.json
          gh api /users/Rohit-Seera --jq '.public_repos' > public_repos.txt
          test -s contributions.json
          test -s public_repos.txt

      - name: Generate local stats and snake cards
        run: python .github/scripts/generate_contribution_assets.py

      - name: Restore README asset paths and original profile sections
        run: |
          cp profile/stats.svg github-stats.svg
          cp profile/streak.svg github-streak.svg
          cp profile/contribution-count.svg contribution-count.svg
          cp profile/contribution-eaten.svg contribution-eaten.svg
          cp dist/github-snake.svg github-snake.svg
          cp dist/github-snake-dark.svg github-snake-dark.svg
          python - <<'PY'
          from pathlib import Path
          import base64

          p = Path("README.md")
          s = p.read_text(encoding="utf-8")

          # Use the dark GitHub-style heatmap snake in the profile README.
          s = s.replace(
              '<img src="./github-snake.svg" alt="GitHub contribution snake" />',
              '<img src="./github-snake-dark.svg" alt="GitHub contribution snake" />'
          )

          # Restore the exact Connect section from the original profile source.
          marker = "## Connect\n"
          connect_b64 = ""
          if marker in s:
              connect = base64.b64decode(connect_b64).decode("utf-8")
              s = s[:s.index(marker)] + connect

          p.write_text(s, encoding="utf-8")
          PY

      - name: Remove duplicate contribution total from external streak card
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("README.md")
          s = p.read_text(encoding="utf-8")
          s = s.replace(
              "&dates=8B949E\" alt=\"GitHub contribution streak\"",
              "&dates=8B949E&hide_total_contributions=true\" alt=\"GitHub contribution streak\""
          )
          p.write_text(s, encoding="utf-8")
          PY

      - name: Commit refreshed profile cards and README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md profile/stats.svg profile/streak.svg profile/contribution-count.svg profile/contribution-eaten.svg github-stats.svg github-streak.svg contribution-count.svg contribution-eaten.svg github-snake.svg github-snake-dark.svg
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh GitHub profile stats [skip ci]"
          git push

      - name: Publish snake assets to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
